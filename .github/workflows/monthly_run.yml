name: Monthly Data Scrape and Test

on:
  schedule:
    - cron: '0 0 1 * *'  # Runs at 00:00 on the 1st day of every month
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build-and-commit:
    runs-on: ubuntu-latest
    needs: test # Only run this job if the tests pass
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # Only run on schedule or manual trigger
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper and processor
        run: python src/main.py

      - name: Commit and push if it changed
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add -A
          git diff --staged --quiet || (git commit -m "Automated data update" && git push)